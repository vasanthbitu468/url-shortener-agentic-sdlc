name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test (coverage gate 85%)
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  orchestrator-demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run demo scenario end to end (mock LLM, CI auto-approval)
        run: |
          sdlc run scenarios/demo-version-endpoint --auto-approve --run-id ci-demo
          sdlc verify ci-demo
          sdlc metrics ci-demo
          git apply --check runs/ci-demo/changes.patch

      - name: Upload run artifacts (audit log, patch, summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-run
          path: |
            runs/ci-demo/events.jsonl
            runs/ci-demo/state.json
            runs/ci-demo/artifacts/
            runs/ci-demo/changes.patch
            runs/ci-demo/summary.md
            runs/ci-demo/pr_description.md

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t url-shortener:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 url-shortener:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          code=$(curl -fs -X POST localhost:8000/api/v1/urls -H 'content-type: application/json' \
            -d '{"url":"https://example.com","custom_alias":"ci-check"}' | python -c 'import sys,json;print(json.load(sys.stdin)["code"])')
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/$code)" = "302"
          docker logs app
