[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "url-shortener-agentic-sdlc"
version = "0.2.0"
description = "URL shortener service built and evolved by a governed agentic SDLC orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Pinned so the generated OpenAPI contract (service/openapi.json) is reproducible.
dependencies = [
    "fastapi==0.162.0",
    "starlette==1.7.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.16.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
]
live = [
    "anthropic>=0.40",
]

[project.scripts]
sdlc = "orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["service*", "orchestrator*"]

[tool.pytest.ini_options]
# tests/ = service tests (also run inside agent workspaces); tests_orchestrator/ = engine tests
testpaths = ["tests", "tests_orchestrator"]
addopts = "-q"

[tool.coverage.run]
source = ["service", "orchestrator"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests_orchestrator/**" = ["S101", "S603", "S607"]
